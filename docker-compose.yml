# ============================================================
# Homely — Full-Stack Docker Compose (PostgreSQL)
# Usage:
#   docker compose up -d --build     # Build + start toàn bộ
#   docker compose logs -f backend   # Xem log backend
#   docker compose down              # Dừng container
# ============================================================

services:
  # ── PostgreSQL local ────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: homely_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: homely
      POSTGRES_USER: homely
      POSTGRES_PASSWORD: homely123
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - homely
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homely -d homely"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend API (Spring Boot + PostgreSQL) ──────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homely_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/homely
      DB_USERNAME: homely
      DB_PASSWORD: homely123
      JWT_SECRET: ${JWT_SECRET:-homely-super-secret-jwt-key-at-least-64-chars-long-for-security}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      REPLICATE_API_KEY: ${REPLICATE_API_KEY:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - homely

  # ── Frontend (React + Nginx) ────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homely_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - homely

volumes:
  uploads_data:
    driver: local
  db_data:
    driver: local

networks:
  homely:
    driver: bridge
