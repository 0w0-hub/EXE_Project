# ============================================================
# Homely — Full-Stack Docker Compose (SQLite)
# Usage:
#   docker compose up -d --build     # Build + start toàn bộ
#   docker compose logs -f backend   # Xem log backend
#   docker compose down              # Dừng container (dữ liệu vẫn giữ tại ./data)
# ============================================================

services:
  # ── Backend API (Spring Boot + SQLite) ──────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homely_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_URL: "jdbc:sqlite:/app/data/homely.db?date_class=integer"
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-64-char-string}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      REPLICATE_API_KEY: ${REPLICATE_API_KEY:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./data:/app/data
      - uploads_data:/app/uploads
    networks:
      - homely

  # ── Frontend (React + Nginx) ────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homely_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - homely

volumes:
  uploads_data:
    driver: local

networks:
  homely:
    driver: bridge
