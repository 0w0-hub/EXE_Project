# ============================================================
# Homely — Full-Stack Docker Compose (SQLite)
# Usage:
#   docker compose up -d --build     # Build + start toàn bộ
#   docker compose logs -f backend   # Xem log backend
#   docker compose down              # Dừng container (dữ liệu vẫn giữ tại ./data)
# ============================================================

services:
  # ── Backend API (Spring Boot + SQLite) ──────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homely_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-64-char-string}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      REPLICATE_API_KEY: ${REPLICATE_API_KEY:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-http://localhost:80/subscribe/success}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-http://localhost:80/subscribe/cancel}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./data:/app/data
      - uploads_data:/app/uploads
    networks:
      - homely

  # ── Frontend (React + Nginx) ────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homely_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - homely

volumes:
  uploads_data:
    driver: local

networks:
  homely:
    driver: bridge
